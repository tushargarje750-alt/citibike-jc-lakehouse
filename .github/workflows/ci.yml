name: CI

# Runs on every push to main and on every pull request.
#   1. Python unit tests        - ingestion logic and helper scripts, no Databricks needed
#   2. Terraform fmt + validate - the job definition is well-formed
#   3. dbt build + tests        - builds silver and gold from ONE month of bronze into
#                                 separate ci_ schemas, so real tables are never touched

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install "pytest>=8,<10"

      - name: Run unit tests
        run: pytest

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Download the provider
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  dbt:
    name: dbt build + tests (ci_ schemas)
    runs-on: ubuntu-latest
    needs: unit-tests
    # Secrets are not passed to pull requests that come from forks, so skip those.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # All CI runs share the ci_ schemas, so let them run one at a time.
    concurrency:
      group: dbt-ci-schemas
      cancel-in-progress: false
    env:
      DBT_DATABRICKS_HOST: ${{ secrets.DBT_DATABRICKS_HOST }}
      DBT_DATABRICKS_HTTP_PATH: ${{ secrets.DBT_DATABRICKS_HTTP_PATH }}
      DBT_ENV_SECRET_DATABRICKS_TOKEN: ${{ secrets.DBT_ENV_SECRET_DATABRICKS_TOKEN }}
      DBT_SCHEMA_PREFIX: ci_
      CI_SOURCE_MONTH: "202610"
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dbt
        run: pip install -r ../requirements-dev.txt

      - name: Check the project parses
        run: dbt parse

      - name: Build and test one month in the ci_ schemas
        run: |
          dbt build --full-refresh --vars "{only_source_month: '$CI_SOURCE_MONTH'}"

      - name: Summarise the run
        if: always()
        run: |
          if [ -f target/run_results.json ]; then
            python ../scripts/dbt_run_summary.py target/run_results.json | tee summary.txt
            { echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the dbt artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dbt-ci-artifacts
          path: |
            dbt/target/run_results.json
            dbt/target/manifest.json
          if-no-files-found: ignore
