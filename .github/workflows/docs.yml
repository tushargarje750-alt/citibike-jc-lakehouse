name: Publish dbt docs

# Rebuilds the dbt documentation site (model descriptions + lineage graph) and
# publishes it to GitHub Pages whenever the dbt project changes on main.

on:
  push:
    branches: [main]
    paths:
      - "dbt/**"
      - "scripts/prepare_docs_site.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Generate docs
    runs-on: ubuntu-latest
    env:
      DBT_DATABRICKS_HOST: ${{ secrets.DBT_DATABRICKS_HOST }}
      DBT_DATABRICKS_HTTP_PATH: ${{ secrets.DBT_DATABRICKS_HTTP_PATH }}
      DBT_ENV_SECRET_DATABRICKS_TOKEN: ${{ secrets.DBT_ENV_SECRET_DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dbt
        run: pip install -r requirements-dev.txt

      - name: Generate the docs (reads table metadata from the real schemas)
        working-directory: dbt
        run: dbt docs generate

      - name: Assemble the site and remove owner emails
        run: python scripts/prepare_docs_site.py dbt/target site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
